# Publishes the game whenever main changes, by copying the site files to the
# gh-pages branch. GitHub Pages serves that branch at
# https://<owner>.github.io/<repo>/  (Settings → Pages → Source: Deploy from a branch → gh-pages).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish site files to gh-pages
        run: |
          mkdir _site
          cp -r index.html style.css js drawings _site/
          touch _site/.nojekyll
          cd _site
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Deploy ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
